name: GenLayer nix cache push
description: >-
  Upload everything this job built locally to the attic binary cache, so the
  next run substitutes it instead of rebuilding.
inputs:
  token:
    description: >-
      push token for the cache. Empty disables the step entirely: a pull request
      from a fork gets no secrets, and such a run must still pass.
    required: false
    default: ""
  token_ssm_parameter:
    description: >-
      SSM SecureString parameter holding the push token, read in-job with
      `aws_role_arn` instead of passing `token`. The cache host keeps it fresh,
      so it never expires unnoticed. Set one of the two, not both. A fork's
      pull request gets no OIDC token and skips the step, like an empty `token`;
      any other job without one fails, because it lacks `id-token: write`. A
      failed read is a failed upload: a warning, or with `verify` an error.
    required: false
    default: ""
  aws_role_arn:
    description: >-
      IAM role the job assumes with its GitHub OIDC token to read the SSM
      parameter above (devexp-tf-infra, github-oidc-<repo>-nix-cache-tokens).
      Required with that input; the job needs `permissions: id-token: write`.
    required: false
    default: ""
  aws_region:
    description: region of the SSM parameter
    required: false
    default: us-east-1
  cache:
    description: cache name on the server
    required: false
    default: genlayer
  endpoint:
    description: attic server the cache lives on
    required: false
    default: https://nix-cache.ygr.ai
  include:
    description: >-
      Regex matched against the store path name with its hash stripped. Narrows
      the locally-built set to our own derivations: a build also realizes
      third-party intermediates that upstream caches already serve.
    required: false
    default: genlayer|genvm
  exclude:
    description: regex matched against the full store path; empty disables
    required: false
    default: ""
  verify:
    description: >-
      "true" fails the job unless every pushed path is in the cache afterwards:
      a failed client build, path listing, login or upload exits 1 instead of
      warning, and each pushed path is then read back from the cache with the
      push token. Set it on a job whose output consumers depend on (a release,
      the build that warms a branch head); an expired token then shows as a red
      job instead of a warning. Default "false": a cache that refuses uploads
      never turns a green build red. An empty token still skips the step.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # No `-x`: the token is passed to `attic login` as an argument.
    - shell: bash -eo pipefail {0}
      if: ${{ inputs.token != '' || inputs.token_ssm_parameter != '' }}
      env:
        NIX_CACHE_PUSH_TOKEN: ${{ inputs.token }}
        PUSH_TOKEN_SSM_PARAMETER: ${{ inputs.token_ssm_parameter }}
        AWS_ROLE_ARN: ${{ inputs.aws_role_arn }}
        AWS_REGION_INPUT: ${{ inputs.aws_region }}
        FORK_PR: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
        CACHE: ${{ inputs.cache }}
        ENDPOINT: ${{ inputs.endpoint }}
        INCLUDE: ${{ inputs.include }}
        EXCLUDE: ${{ inputs.exclude }}
        VERIFY: ${{ inputs.verify }}
      run: |
        cd "$GITHUB_WORKSPACE"

        # A cache that refuses uploads must not turn a green build red, so every
        # step of this script warns and gives up instead of failing the job —
        # unless the caller asked for `verify`, where a missing upload is the
        # failure the job exists to report.
        give_up() {
          if [ "$VERIFY" = "true" ]; then
            echo "::error::$1"
            exit 1
          fi
          echo "::warning::$1"
          exit 0
        }

        if [ -n "$PUSH_TOKEN_SSM_PARAMETER" ]; then
          if [ -n "$NIX_CACHE_PUSH_TOKEN" ]; then
            echo "::error::set token or token_ssm_parameter, not both"
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::token_ssm_parameter needs aws_role_arn"
            exit 1
          fi
          token_file="${RUNNER_TEMP:-/tmp}/attic-push-token"
          rc=0
          "$GITHUB_ACTION_PATH/../support/scripts/read-ssm-token.sh" \
            "$AWS_ROLE_ARN" "$AWS_REGION_INPUT" "$PUSH_TOKEN_SSM_PARAMETER" "$token_file" || rc=$?
          case "$rc" in
            0)
              NIX_CACHE_PUSH_TOKEN="$(cat "$token_file")"
              rm -f "$token_file"
              ;;
            3)
              if [ "$FORK_PR" = "true" ]; then
                echo "a fork's pull request gets no OIDC token; nothing pushed"
                exit 0
              fi
              echo "::error::no OIDC token to read $PUSH_TOKEN_SSM_PARAMETER; add 'permissions: id-token: write' to the job"
              exit 1
              ;;
            *)
              give_up "could not read the push token from $PUSH_TOKEN_SSM_PARAMETER; nothing pushed"
              ;;
          esac
        fi

        attic_link="${RUNNER_TEMP:-/tmp}/attic-client"
        # An out-link rather than `nix run`: it is a gcroot, and a second call
        # in the same job skips both evaluation and substitution.
        # `--inputs-from .` resolves `nixpkgs` through our flake lock, so the
        # client comes from the pinned revision instead of the mutable registry.
        if ! nix build --out-link "$attic_link" --inputs-from . nixpkgs#attic-client; then
          give_up "could not build the attic client; nothing pushed"
        fi

        # `ultimate` is nix's own flag for "built on this machine", which is
        # exactly the set worth uploading: everything else arrived from a
        # substituter that already has it. It covers the intermediates the
        # final artifact is assembled from, not just the artifact.
        paths="${RUNNER_TEMP:-/tmp}/attic-paths"
        nix path-info --all --json --json-format 1 \
          | jq -r --arg inc "$INCLUDE" --arg exc "$EXCLUDE" '
              to_entries[]
              | select(.value.ultimate)
              | select($inc == "" or (.key | sub("^/nix/store/[^-]+-"; "") | test($inc)))
              | select(.key | test("(-|\\.)(source|socket|service|env|pam|drv)$") | not)
              | select($exc == "" or (.key | test($exc) | not))
              | .key' > "$paths" || {
                [ "$VERIFY" != "true" ] || give_up "failed to enumerate locally-built paths"
                echo "::error::failed to enumerate locally-built paths"
              }

        echo "::group::artifacts"
        cat "$paths"
        echo "::endgroup::"

        if [ ! -s "$paths" ]; then
          echo "nothing was built locally; nothing to push"
          exit 0
        fi
        echo "pushing $(wc -l < "$paths") path(s) to $CACHE"

        if ! "$attic_link/bin/attic" login ci "$ENDPOINT" "$NIX_CACHE_PUSH_TOKEN" --set-default; then
          give_up "attic login failed; nothing pushed"
        fi

        # Redirect stdin from the path list rather than `xargs -a FILE`: -a is a
        # GNU extension and BSD/macOS xargs rejects it, which broke the push on
        # macOS runners. `< file` reads the same list and is portable.
        if ! < "$paths" xargs "$attic_link/bin/attic" push --jobs 4 "$CACHE"; then
          give_up "attic push failed (Unauthorized means the push token expired)"
        fi

        [ "$VERIFY" = "true" ] || exit 0

        # Read every pushed path back from the cache, so a push that reported
        # success but left a path out still fails. The push token can pull, and
        # it reaches curl through a config on stdin, not the command line.
        checked=0
        missing=0
        while IFS= read -r path; do
          checked=$((checked + 1))
          hash="$(basename "$path")"
          hash="${hash%%-*}"
          code="$(printf 'header = "Authorization: Bearer %s"\n' "$NIX_CACHE_PUSH_TOKEN" \
            | curl -sS -o /dev/null -w '%{http_code}' -K - "$ENDPOINT/$CACHE/$hash.narinfo" || true)"
          if [ "$code" != "200" ]; then
            echo "::error::$path is not in the $CACHE cache (HTTP $code)"
            missing=$((missing + 1))
          fi
        done < "$paths"
        if [ "$missing" -gt 0 ]; then
          echo "::error::$missing pushed path(s) are not in the $CACHE cache"
          exit 1
        fi
        echo "verified $checked path(s) in $CACHE"
